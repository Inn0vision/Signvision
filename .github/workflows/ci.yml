name: SignVision CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Backend & Video Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r video-service/requirements.txt
          pip install pytest httpx

      - name: Verify Dataset Symmetry Invariant
        run: |
          diff -u data/sign_language_data.json Application/src/data/sign_language_data.json

      - name: Run Backend Unit Tests
        env:
          PYTHONPATH: ".:backend"
          GROQ_API_KEY: "mock_ci_key"
        run: |
          pytest backend/tests/

      - name: Run Video Service Unit Tests
        env:
          PYTHONPATH: ".:video-service:signvision_isl_inference_bundle"
        run: |
          pytest video-service/

      - name: Run ISL Model Bundle Smoke Test
        run: |
          python signvision_isl_inference_bundle/smoke_test.py

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f compose.yaml config
          BACKEND_IMAGE=test-backend:ci VIDEO_IMAGE=test-video:ci docker compose -f compose.prod.yaml config

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Application/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Application
          npm ci --legacy-peer-deps || npm install

      - name: Run Frontend TypeScript Check
        run: |
          cd Application
          npx tsc --noEmit
