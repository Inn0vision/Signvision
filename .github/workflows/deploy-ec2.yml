name: SignVision Deploy to EC2 (Direct SSH & Docker Compose)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'video-service/**'
      - 'signvision_isl_inference_bundle/**'
      - 'compose.yaml'
      - 'Caddyfile'
      - '.github/workflows/deploy-ec2.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed components
        id: changes
        run: |
          BACKEND_CHANGED="false"
          VIDEO_CHANGED="false"
          CONFIG_CHANGED="false"

          if git diff --name-only HEAD~1 HEAD | grep -E '^backend/'; then
            BACKEND_CHANGED="true"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -E '^(video-service/|signvision_isl_inference_bundle/)'; then
            VIDEO_CHANGED="true"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -E '^(compose\.yaml|Caddyfile|\.github/)'; then
            CONFIG_CHANGED="true"
          fi

          # If it's a fresh setup or config changed, build all
          if [ "$CONFIG_CHANGED" = "true" ] || [ "$BACKEND_CHANGED" = "true" -a "$VIDEO_CHANGED" = "true" ]; then
            TARGET_SERVICE="all"
          elif [ "$VIDEO_CHANGED" = "true" ]; then
            TARGET_SERVICE="video-service"
          elif [ "$BACKEND_CHANGED" = "true" ]; then
            TARGET_SERVICE="backend"
          else
            TARGET_SERVICE="all"
          fi

          echo "target_service=$TARGET_SERVICE" >> "$GITHUB_OUTPUT"
          echo "Deploying target service: $TARGET_SERVICE"

      - name: Deploy to EC2 via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST || '35.154.167.249' }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          TARGET: ${{ steps.changes.outputs.target_service }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "Connecting to $EC2_USER@$EC2_HOST..."
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "bash -s" << EOF
            set -euo pipefail
            cd /opt/signvision

            # Pull latest changes from git
            echo "Updating code to commit $COMMIT_SHA..."
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/Pruthviraj141/Signvision.git .
            fi

            # Independent service build and deployment
            echo "Deploying target: $TARGET"
            if [ "$TARGET" = "video-service" ]; then
              echo "Rebuilding and restarting ONLY video-service..."
              docker compose build video-service
              docker compose up -d --no-deps video-service
            elif [ "$TARGET" = "backend" ]; then
              echo "Rebuilding and restarting ONLY backend..."
              docker compose build backend
              docker compose up -d --no-deps backend
            else
              echo "Building and updating full stack..."
              docker compose build
              docker compose up -d --remove-orphans
            fi

            # Health verification
            echo "Verifying health checks..."
            for i in {1..20}; do
              if curl -s -f http://127.0.0.1/core/health > /dev/null 2>&1 && curl -s -f http://127.0.0.1/video/health > /dev/null 2>&1; then
                echo "=== DEPLOYMENT VERIFIED HEALTHY ==="
                docker compose ps
                exit 0
              fi
              echo "Waiting for healthy containers (\$i/20)..."
              sleep 4
            done

            echo "Health verification failed!"
            docker compose logs --tail=50
            exit 1
          EOF
