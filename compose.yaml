services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signvision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_ENABLED=true
      - REDIS_CACHE_TTL=604800
      - TRANSLATION_CACHE_VERSION=v1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_API_KEY_FALLBACK_1=${GROQ_API_KEY_FALLBACK_1:-}
      - GROQ_API_KEY_FALLBACK_2=${GROQ_API_KEY_FALLBACK_2:-}
      - GROQ_API_KEY_FALLBACK_3=${GROQ_API_KEY_FALLBACK_3:-}
      - GROQ_API_KEYS=${GROQ_API_KEYS:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - signvision-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  video-service:
    build:
      context: .
      dockerfile: video-service/Dockerfile
    container_name: signvision-video-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - SIGN_CONFIDENCE_THRESHOLD=0.50
      - MIN_HAND_COVERAGE=0.50
    networks:
      - signvision-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    container_name: signvision-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - signvision-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2.8-alpine
    container_name: signvision-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - video-service
    networks:
      - signvision-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  signvision-network:
    driver: bridge
